(() => {
  const dialog = document.getElementById('target-dialog');
  document.getElementById('target-open').onclick = () => {
    dialog.showModal();
    document.getElementById('refresh-devices').click();
  };
  document.getElementById('target-close').onclick = () => dialog.close();
  document.getElementById('target-device').addEventListener('change', () => dialog.close());
  dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) dialog.close();
  });
})();
</script></body></html>
